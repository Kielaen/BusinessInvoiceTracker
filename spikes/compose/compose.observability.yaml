services:
  auth-api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      aspire-dashboard:
        condition: service_started

  workflow-api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      aspire-dashboard:
        condition: service_started

  workflow-dapr:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      aspire-dashboard:
        condition: service_started
